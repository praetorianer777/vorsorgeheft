name: vorsorgereminder
description: >-
  Preventive-care appointments for the whole family, derived from each date of birth.
  Local-only, no account, with ICS export and encrypted device-to-device sync.
publish_to: none
version: 0.1.0+1

environment:
  # 3.10 is the floor for dot-shorthand syntax, which the Flutter templates emit.
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Persistence
  drift: ^2.20.0
  sqlite3: ^3.0.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Reminders
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  permission_handler: ^13.0.2

  # Export / sharing
  share_plus: ^13.3.0

  # Sync
  cryptography: ^2.7.0          # X25519, HKDF, AES-GCM
  mobile_scanner: ^7.4.2        # scan QR codes
  qr_flutter: ^4.1.0            # render QR codes
  multicast_dns: ^0.3.2+7       # peer discovery on the LAN

  # State
  flutter_riverpod: ^3.4.3

  # Misc
  collection: ^1.18.0
  url_launcher: ^6.3.0
  intl: ^0.20.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
  generate: true          # builds AppLocalizations from lib/l10n/*.arb
  assets:
    - assets/catalogs/
