# An installable APK for every state of main, so the app can be tried on a
# phone long before there is a release to cut. Deliberately its own workflow
# rather than a step in ci.yml: the PR gate has to stay fast, and an Android
# build is minutes of Gradle that nothing in a review depends on.
name: APK

on:
  push:
    branches: [main]
  # Also on a pull request that touches the build itself, so a change that
  # breaks the Android build is caught in review rather than on main, where
  # the downloadable APK would already be gone.
  pull_request:
    paths:
      - ".github/workflows/apk.yml"
      - "android/**"
      - "pubspec.yaml"
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # One fat APK rather than --split-per-abi: this is for installing by hand
      # from a phone browser, where picking the right ABI is a way to end up
      # with an APK that will not install.
      # The drift tables and the localisations are generated, and generated
      # code is not in the repo. Without this the build fails on a fresh
      # checkout with a wall of missing types.
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build apk --release

      - name: Name the file after the commit it came from
        id: name
        run: |
          version="$(sed -n 's/^version: *\([0-9.+]*\).*/\1/p' pubspec.yaml)"
          name="vorsorgereminder-${version}-${GITHUB_SHA::7}-debugsigned"
          cp build/app/outputs/flutter-apk/app-release.apk "$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### $name.apk"
            echo
            echo "Debug-signed. Installable, but not a release build: Android will"
            echo "refuse to update it from a properly signed release later, so"
            echo "uninstall it first when the real one arrives."
            echo
            echo "SHA256: \`$(sha256sum "$name.apk" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ steps.name.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 90
