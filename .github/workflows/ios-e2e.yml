# The same specs the Android emulator runs, on an iOS simulator: the file
# that carries a family from one phone to the next has to open on either
# platform, and the only way to know is to run the round trip on both. A
# macOS runner is slow and expensive, so this runs nightly rather than on
# every PR, like the Android run.
name: iOS E2E

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

concurrency:
  group: ios-e2e
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The drift tables and the localisations are generated, and generated
      # code is not in the repo. Without this the build fails on a fresh
      # checkout with a wall of missing types.
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Boot a simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | test("^iPhone"))][-1].udid')"
          [[ -n "$udid" && "$udid" != null ]] || { echo "::error::no iPhone simulator on this runner"; exit 1; }
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - run: flutter test integration_test/ --reporter expanded -d "${{ steps.simulator.outputs.udid }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-e2e-logs
          path: build/
          if-no-files-found: ignore
