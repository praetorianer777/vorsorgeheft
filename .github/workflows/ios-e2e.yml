# The same specs the Android emulator runs, on an iOS simulator: the file
# that carries a family from one phone to the next has to open on either
# platform, and the only way to know is to run the round trip on both. A
# macOS runner is slow and expensive, so this runs nightly rather than on
# every PR, like the Android run.
name: iOS E2E

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

concurrency:
  group: ios-e2e
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-latest
    # Room for one hung attempt to be cut short at thirty-five minutes and a
    # second one to run properly.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The drift tables and the localisations are generated, and generated
      # code is not in the repo. Without this the build fails on a fresh
      # checkout with a wall of missing types.
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Boot a simulator
        id: simulator
        run: |
          # This preference belongs to Simulator.app, which a simctl run
          # never starts, so it is a hint rather than a guarantee: the specs
          # drop the keyboard themselves before a dialog closes.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool true
          udid="$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | test("^iPhone"))][-1].udid')"
          [[ -n "$udid" && "$udid" != null ]] || { echo "::error::no iPhone simulator on this runner"; exit 1; }
          # From a known state: the runner image may already have one booted,
          # and a device that has been used once is not the device the last
          # green run had.
          xcrun simctl shutdown all || true
          xcrun simctl erase "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Not flutter test directly: about one run in three hangs after the
      # Xcode build without reaching a single test, and this cuts that short
      # and starts over rather than spending the job's whole budget on it.
      - run: tools/ios-e2e.sh "${{ steps.simulator.outputs.udid }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-e2e-logs
          path: build/
          if-no-files-found: ignore
