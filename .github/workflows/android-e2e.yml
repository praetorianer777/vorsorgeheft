# The emulator needs KVM and takes minutes to boot, so the integration tests are
# opt-in locally (ANDROID_E2E=1) and nightly here instead of gating every push.
name: Android E2E

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: android-e2e
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The drift tables and the localisations are generated, and generated
      # code is not in the repo. Without this the build fails on a fresh
      # checkout with a wall of missing types.
      - run: dart run build_runner build --delete-conflicting-outputs

      # Built before the emulator boots so it can be installed and granted
      # POST_NOTIFICATIONS ahead of the tests. `flutter test` installs its own
      # build over it with `adb install -r`, which keeps the runtime
      # permissions of the same package; asking for the permission from inside
      # the test would open a dialog nobody is there to answer.
      - run: flutter build apk --debug

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: |
            adb install -t -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm grant io.github.praetorianer777.vorsorgeheft android.permission.POST_NOTIFICATIONS
            flutter test integration_test/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e-logs
          path: build/
          if-no-files-found: ignore
