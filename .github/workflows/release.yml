# Builds and publishes the APK for a v* tag. Every step is written to survive a
# re-run of the same tag, because a release that fails halfway must be fixable
# by pressing the button again rather than by deleting and re-cutting the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check the tag against pubspec.yaml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pub="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"
          [[ "$tag" == "$pub" ]] || echo "::warning::tag $tag != pubspec $pub"

      # Without a keystore the build is debug-signed, which is fine for testing
      # but must never look like a finished release, hence the prerelease flag
      # further down.
      - name: Set up signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::warning::no KEYSTORE_BASE64 secret - building a debug-signed APK"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base64 -d <<< "$KEYSTORE_BASE64" > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # The drift tables and the localisations are generated, and generated
      # code is not in the repo. Without this the build fails on a fresh
      # checkout with a wall of missing types.
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build apk --release --split-per-abi

      - name: Collect artifacts and checksums
        id: collect
        run: |
          mkdir -p artifacts
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            cp "$f" "artifacts/vorsorgereminder-${GITHUB_REF_NAME}-$(basename "$f" | sed 's/app-//;s/-release\.apk//').apk"
          done
          {
            echo "| Datei | SHA256 |"
            echo "|---|---|"
            for f in artifacts/*.apk; do
              echo "| $(basename "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY" > artifacts/SHA256SUMS.md

      - name: Resolve release notes
        run: |
          if [[ -f "release-notes-${GITHUB_REF_NAME}.md" ]]; then
            cp "release-notes-${GITHUB_REF_NAME}.md" notes.md
          else
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          fi
          cat artifacts/SHA256SUMS.md >> notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.signing.outputs.signed == 'true' && ' ' || '--prerelease' }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $PRERELEASE
          gh release upload "$GITHUB_REF_NAME" artifacts/*.apk --clobber
