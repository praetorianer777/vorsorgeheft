# The PR gate. It holds nothing but run-tests.sh on purpose: whatever gates a
# push locally through the branch-guard hook is exactly what gates it here, so
# the two can never drift apart.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The upgrade tests compare their fixtures against the release tags.
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: ./run-tests.sh
