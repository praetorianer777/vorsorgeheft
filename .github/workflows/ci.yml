# The PR gate. It holds nothing but run-tests.sh on purpose: whatever gates a
# push locally through the branch-guard hook is exactly what gates it here, so
# the two can never drift apart.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The upgrade tests compare their fixtures against the release tags,
      # which a shallow checkout of a PR merge commit does not carry.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: ./run-tests.sh

      # Multicast is what a lookup rides on, and a PR gate should not depend
      # on the runner's network, so the one test that needs it runs nightly.
      - name: Discovery over multicast
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          MDNS_E2E: "1"
        run: flutter test test/sync/mdns_discovery_test.dart
